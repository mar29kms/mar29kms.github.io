<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문자 발송</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  .item.sent { background: #e9f7ef; }
  .item .msg { white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body class="bg-light">
<div class="container py-3" style="max-width:720px">
  <h4 class="mb-3">문자 발송</h4>

  <div class="card mb-3">
    <div class="card-body">
      <label class="form-label fw-bold">CSV 파일 선택</label>
      <input type="file" id="csvFile" class="form-control" accept=".csv,text/csv">
      <div class="form-text">
        항목 순서: <code>그룹,이름,전화번호,문자내용</code> (제목행은 자동 인식)
        · <a href="#" id="sampleLink">샘플 CSV 받기</a>
      </div>
    </div>
  </div>

  <div class="row g-2 align-items-center mb-2">
    <div class="col-6">
      <select id="groupSel" class="form-select"><option value="">전체 그룹</option></select>
    </div>
    <div class="col-6 text-end">
      <span class="small text-muted" id="summary">0건</span>
      <button class="btn btn-sm btn-outline-secondary ms-1" id="btnReset">발송표시 초기화</button>
    </div>
  </div>

  <div class="list-group" id="list"></div>
</div>

<script>
let rows = [];   // {group,name,phone,message,sent}
const $ = id => document.getElementById(id);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function parseCSV(text) {
  const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n') { row.push(cur); out.push(row); row = []; cur = ''; }
      else if (c !== '\r') cur += c;
    }
  }
  if (cur !== '' || row.length) { row.push(cur); out.push(row); }
  return out.filter(r => r.some(v => v.trim() !== ''));
}

async function readFileText(file) {
  const buf = await file.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('\uFFFD')) text = new TextDecoder('euc-kr').decode(buf);
  return text.replace(/^\uFEFF/, '');
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('csvFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  const data = parseCSV(await readFileText(f));
  if (data.length && /그룹|group/i.test(data[0][0])) data.shift();
  rows = data.map(r => ({
    group: (r[0] || '').trim(),
    name: (r[1] || '').trim(),
    phone: (r[2] || '').replace(/[^0-9+]/g, ''),
    message: (r[3] || '').trim(),
    sent: false
  }));
  const gs = [...new Set(rows.map(r => r.group))].sort((a, b) => a.localeCompare(b, 'ko', {numeric: true}));
  $('groupSel').innerHTML = '<option value="">전체 그룹</option>' +
    gs.map(g => `<option value="${esc(g)}">${g ? esc(g) + ' 그룹' : '(그룹없음)'}</option>`).join('');
  render();
});

function smsHref(r) {
  return `sms:${r.phone}${isIOS ? '&' : '?'}body=${encodeURIComponent(r.message)}`;
}

function render() {
  const g = $('groupSel').value;
  const v = rows.map((r, i) => ({r, i})).filter(o => g === '' || o.r.group === g);
  $('list').innerHTML = v.map(({r, i}) => `
    <div class="list-group-item item ${r.sent ? 'sent' : ''}" id="row${i}">
      <div class="d-flex justify-content-between align-items-start gap-2">
        <div class="flex-grow-1">
          <div>
            <span class="badge text-bg-secondary">${esc(r.group) || '-'}</span>
            <strong>${esc(r.name)}</strong>
            <span class="text-muted">${esc(r.phone)}</span>
          </div>
          <div class="msg small mt-1">${esc(r.message)}</div>
        </div>
        <a class="btn ${r.sent ? 'btn-outline-success' : 'btn-primary'} btn-sm text-nowrap"
           href="${smsHref(r)}" data-i="${i}">${r.sent ? '✔ 다시' : '문자 보내기'}</a>
      </div>
    </div>`).join('');
  const sentCnt = v.filter(o => o.r.sent).length;
  $('summary').textContent = `${sentCnt} / ${v.length}건 발송`;
}

// 버튼 터치 시 문자앱으로 이동하면서 '발송함' 표시
$('list').addEventListener('click', e => {
  const a = e.target.closest('a[data-i]');
  if (!a) return;
  const i = +a.dataset.i;
  rows[i].sent = true;
  setTimeout(render, 300);   // 링크 이동 후 화면 갱신
});

$('groupSel').addEventListener('change', render);
$('btnReset').addEventListener('click', () => { rows.forEach(r => r.sent = false); render(); });

$('sampleLink').addEventListener('click', e => {
  e.preventDefault();
  const csv = '\uFEFF그룹,이름,전화번호,문자내용\n1,홍길동,01012345678,안녕하세요 공지입니다\n1,김철수,01011112222,안녕하세요 공지입니다\n2,이영희,01033334444,2그룹 안내 문자입니다\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = 'sample.csv'; a.click();
});
</script>
</body>
</html>
