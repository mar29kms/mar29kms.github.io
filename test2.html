<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재고조사</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  body { background:#f4f6f9; }
  .grid-input { min-width:70px; border:1px solid transparent; background:transparent; padding:.25rem .4rem; }
  .grid-input:focus { background:#fff; border-color:#86b7fe; }
  td.num input { text-align:right; }
  tr.flash { animation: flash 1.2s; }
  @keyframes flash { from { background:#fff3a0; } to { background:transparent; } }
  #reader { width:100%; }
  .result-list { position:absolute; z-index:20; left:0; right:0; max-height:50vh; overflow:auto; }
  thead th { position:sticky; top:0; background:#212529; color:#fff; white-space:nowrap; z-index:5; }
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark sticky-top">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1"><i class="bi bi-clipboard-check"></i> 재고조사</span>
    <span class="text-white-50 small" id="summary"></span>
  </div>
</nav>

<div class="container-fluid py-3">
  <!-- 검색 / 스캔 -->
  <div class="row g-2 mb-3">
    <div class="col-12 col-md-7 position-relative">
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input id="q" class="form-control" placeholder="코드·바코드·상품명·규격 검색 후 추가" autocomplete="off">
        <button class="btn btn-primary" id="btnScan"><i class="bi bi-camera"></i> 바코드 스캔</button>
      </div>
      <div id="results" class="list-group shadow result-list d-none"></div>
    </div>
    <div class="col-12 col-md-5 d-flex gap-2 justify-content-md-end">
      <button class="btn btn-success" id="btnSave"><i class="bi bi-cloud-upload"></i> 저장</button>
      <div class="btn-group">
        <button class="btn btn-outline-secondary" id="btnUpload"><i class="bi bi-upload"></i> CSV 업로드</button>
        <button class="btn btn-outline-secondary" id="btnCsv"><i class="bi bi-download"></i> CSV 다운로드</button>
        <button class="btn btn-outline-secondary dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown"></button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#" id="btnSample">샘플 8건 불러오기</a></li>
          <li><a class="dropdown-item" href="#" id="btnTemplate">업로드 양식(샘플) 받기</a></li>
          <li><a class="dropdown-item" href="#" id="btnMasterCsv">상품 마스터 전체 받기</a></li>
        </ul>
      </div>
      <input type="file" id="fileCsv" accept=".csv,text/csv" class="d-none">
      <button class="btn btn-outline-danger" id="btnClear"><i class="bi bi-trash"></i> 비우기</button>
    </div>
  </div>

  <!-- 조사 목록 -->
  <div class="card shadow-sm">
    <div class="table-responsive" style="max-height:70vh">
      <table class="table table-sm table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>코드</th><th>바코드</th><th>상품명</th><th>규격</th><th>단위</th>
            <th class="text-end">전산재고</th><th class="text-end">실재고</th><th class="text-end">차이</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="text-center text-muted py-5">검색하거나 바코드를 스캔해서 조사할 상품을 추가하세요.</div>
  </div>
</div>

<!-- 스캔 모달 -->
<div class="modal fade" id="scanModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">바코드 스캔</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="reader"></div>
        <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
          <button class="btn btn-sm btn-outline-primary text-nowrap" id="btnFocus"><i class="bi bi-bullseye"></i> 초점</button>
          <button class="btn btn-sm btn-outline-warning text-nowrap d-none" id="btnTorch"><i class="bi bi-lightbulb"></i> 조명</button>
          <div id="zoomBox" class="d-none flex-grow-1" style="min-width:150px">
            <div class="d-flex align-items-center gap-2"><i class="bi bi-zoom-in"></i><input type="range" class="form-range" id="zoom"></div>
          </div>
        </div>
        <div id="camBox" class="d-none mt-2">
          <select id="camSel" class="form-select form-select-sm" aria-label="카메라 선택"></select>
        </div>
        <div class="form-text">작은 바코드는 줌을 올리고 폰을 15~25cm 떨어뜨려 비추세요. 초점이 안 맞으면 위 목록에서 다른 후면 카메라를 선택해 보세요(초광각 카메라는 초점이 약합니다).</div>
        <div class="d-flex flex-wrap gap-3 mt-3">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="optSound" checked>
            <label class="form-check-label" for="optSound"><i class="bi bi-volume-up"></i> 소리</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="optPlus1">
            <label class="form-check-label" for="optPlus1">수량 입력 없이 스캔마다 +1</label>
          </div>
        </div>
        <div id="scanMsg" class="mt-2 small text-muted">카메라를 바코드에 비춰주세요.</div>

        <div id="foundPanel" class="card border-success mt-3 d-none">
          <div class="card-body">
            <div class="d-flex justify-content-between gap-2">
              <div>
                <div class="fw-bold fs-5" id="fpName"></div>
                <div class="text-muted small" id="fpSub"></div>
                <div class="text-muted small" id="fpIds"></div>
              </div>
              <div class="text-end text-nowrap"><div class="small text-muted">전산재고</div><div class="fs-4 fw-bold" id="fpStock"></div></div>
            </div>
            <label class="form-label mt-2 mb-1" for="fpQty">실재고 수량</label>
            <div class="input-group input-group-lg">
              <button class="btn btn-outline-secondary" id="fpMinus" type="button">&minus;</button>
              <input type="text" inputmode="decimal" class="form-control text-center fw-bold" id="fpQty" autocomplete="off">
              <button class="btn btn-outline-secondary" id="fpPlus" type="button">+</button>
            </div>
            <div class="d-flex gap-2 mt-3">
              <button class="btn btn-success flex-grow-1" id="fpOk" type="button"><i class="bi bi-check-lg"></i> 확인 후 계속 스캔</button>
              <button class="btn btn-outline-secondary" id="fpCancel" type="button">취소</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast align-items-center text-bg-dark border-0" role="alert">
    <div class="d-flex"><div class="toast-body" id="toastBody"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* ===== 상품 마스터 (샘플) — 실제로는 서버(UniDAC/Firebird → API)에서 가져오세요 ===== */
const ean13 = d12 => d12 + ((10 - [...d12].reduce((s,c,i) => s + (+c) * (i%2 ? 3 : 1), 0) % 10) % 10);
const SAMPLE = [
  ['생수 500ml','20입','박스',12], ['생수 2L','6입','박스',8], ['탄산수 플레인','350ml','개',48],
  ['라면 신라면','120g','봉',240], ['라면 짜파게티','140g','봉',180], ['컵라면 육개장','86g','개',96],
  ['즉석밥','210g','개',150], ['참치캔 살코기','150g','개',120], ['스팸 클래식','200g','개',64],
  ['우유 흰우유','1L','개',36], ['우유 저지방','900ml','개',24], ['요구르트 플레인','80ml×5','팩',40],
  ['계란 특란','30구','판',18], ['식빵','400g','봉',22], ['버터','200g','개',14],
  ['커피믹스','100T','박스',15], ['아메리카노 원두','1kg','봉',9], ['녹차 티백','50T','박스',11],
  ['오렌지주스','1.5L','개',28], ['콜라','1.5L','개',60], ['사이다','1.5L','개',54],
  ['소주','360ml','병',200], ['맥주 캔','500ml','캔',144], ['막걸리','750ml','병',30],
  ['식용유','900ml','개',32], ['간장','500ml','병',26], ['고추장','500g','개',19],
  ['설탕','1kg','봉',45], ['소금','1kg','봉',38], ['밀가루 중력분','1kg','봉',27],
  ['휴지 3겹','30롤','팩',20], ['물티슈','100매','팩',55], ['주방세제','1L','개',33],
].map((r,i) => ({ code: String(1001+i), barcode: ean13('880' + String(1234500000 + i*7).padStart(9,'0')),
                  name:r[0], spec:r[1], unit:r[2], stock:r[3] }));

let MASTER = SAMPLE;
try { const s = JSON.parse(localStorage.getItem('stocktake_master_v1') || 'null'); if (Array.isArray(s) && s.length) MASTER = s; } catch(e) {}

/* ===== 상태 ===== */
const KEY = 'stocktake_rows_v1';
let rows = [];
try { rows = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { rows = []; }
const sampleRows = () => SAMPLE.slice(0, 8).map(m => ({...m, actual: ''}));
try {                                  // 처음 열었을 때 한 번만 간단한 샘플 8건을 목록에 채움
  if (!rows.length && !localStorage.getItem('stocktake_seeded_v2')) { rows = sampleRows(); localStorage.setItem('stocktake_seeded_v2', '1'); }
} catch(e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(rows)); } catch(e) {} };

function toast(msg){ $('toastBody').textContent = msg; bootstrap.Toast.getOrCreateInstance($('toast'), {delay:2000}).show(); }

/* ===== 목록 렌더 ===== */
function render(flashIdx = -1){
  $('rows').innerHTML = rows.map((r,i) => {
    const diff = (Number(r.actual)||0) - (Number(r.stock)||0);
    const cls = diff === 0 ? 'text-muted' : diff > 0 ? 'text-primary' : 'text-danger';
    const inp = (f, extra='') => `<input class="grid-input form-control form-control-sm ${extra}" data-i="${i}" data-f="${f}" value="${esc(r[f])}">`;
    return `<tr class="${i===flashIdx?'flash':''}">
      <td>${inp('code')}</td><td>${inp('barcode')}</td><td>${inp('name')}</td>
      <td>${inp('spec')}</td><td>${inp('unit')}</td>
      <td class="num">${inp('stock','text-end')}</td>
      <td class="num">${inp('actual','text-end fw-bold')}</td>
      <td class="text-end fw-bold ${cls}" id="diff${i}">${diff>0?'+':''}${diff}</td>
      <td><button class="btn btn-sm btn-link text-danger" data-del="${i}"><i class="bi bi-x-lg"></i></button></td>
    </tr>`;
  }).join('');
  $('empty').classList.toggle('d-none', rows.length > 0);
  const done = rows.filter(r => r.actual !== '' && r.actual != null).length;
  $('summary').textContent = `${done} / ${rows.length} 조사`;
  persist();
}

/* 셀 수정 (포커스 유지를 위해 전체 재렌더 대신 값만 반영) */
$('rows').addEventListener('input', e => {
  const t = e.target; if (!t.dataset.f) return;
  const i = +t.dataset.i, f = t.dataset.f;
  rows[i][f] = t.value;
  if (f === 'stock' || f === 'actual') {
    const diff = (Number(rows[i].actual)||0) - (Number(rows[i].stock)||0);
    const td = $('diff'+i);
    td.textContent = (diff>0?'+':'') + diff;
    td.className = 'text-end fw-bold ' + (diff===0?'text-muted':diff>0?'text-primary':'text-danger');
  }
  persist();
});
$('rows').addEventListener('focusin', e => { if (e.target.dataset.f === 'actual' || e.target.dataset.f === 'stock') e.target.select(); });
$('rows').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  rows.splice(+b.dataset.del, 1); render();
});

/* ===== 추가 / 검색 ===== */
function addItem(m, plus1 = false){
  let i = rows.findIndex(r => r.code === m.code);
  if (i < 0) { rows.push({...m, actual: plus1 ? 1 : ''}); i = rows.length - 1; }
  else if (plus1) rows[i].actual = (Number(rows[i].actual)||0) + 1;
  render(i);
  document.querySelectorAll('#rows tr')[i]?.scrollIntoView({block:'nearest'});
  return i;
}

$('q').addEventListener('input', () => {
  const k = $('q').value.trim().toLowerCase();
  const box = $('results');
  if (!k) return box.classList.add('d-none');
  const hit = MASTER.filter(m => [m.code,m.barcode,m.name,m.spec].some(v => String(v).toLowerCase().includes(k))).slice(0,30);
  box.innerHTML = hit.length
    ? hit.map(m => `<button type="button" class="list-group-item list-group-item-action" data-code="${esc(m.code)}">
        <div class="fw-bold">${esc(m.name)} <small class="text-muted">${esc(m.spec)}</small></div>
        <small class="text-muted">${esc(m.code)} · ${esc(m.barcode)} · 전산 ${m.stock}${esc(m.unit)}</small></button>`).join('')
    : '<div class="list-group-item text-muted">검색 결과 없음</div>';
  box.classList.remove('d-none');
});
$('results').addEventListener('click', e => {
  const b = e.target.closest('[data-code]'); if (!b) return;
  addItem(MASTER.find(m => m.code === b.dataset.code));
  $('q').value = ''; $('results').classList.add('d-none'); $('q').focus();
});
document.addEventListener('click', e => { if (!e.target.closest('#q,#results')) $('results').classList.add('d-none'); });
/* 바코드 스캐너(USB/블루투스) 입력: Enter 시 바코드 정확히 일치하면 바로 추가 */
$('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const m = MASTER.find(m => m.barcode === $('q').value.trim());
  if (m) { addItem(m, true); $('q').value=''; $('results').classList.add('d-none'); }
});

/* ===== 카메라 바코드 스캔 ===== */
let scanner = null, lastCode = '', lastTime = 0, scanLocked = false, pending = null;
const modal = new bootstrap.Modal($('scanModal'));

$('btnScan').onclick = () => { initAudio(); modal.show(); };
const CAM_KEY = 'stocktake_cam_v1';
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
const hasBD = 'BarcodeDetector' in window;       // 네이티브 인식 가능 여부(안드로이드 크롬 등)
let camTrack = null, camState = {}, torchOn = false;

async function startScan(deviceId){
  if (scanner) { try { await scanner.stop(); } catch(e) {} try { scanner.clear(); } catch(e) {} }
  scanner = new Html5Qrcode('reader', { verbose: false,
    formatsToSupport: [ Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.QR_CODE ],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
  // qrbox를 주지 않음 = 화면 전체를 분석 (작은 바코드도 놓치지 않도록). 해상도는 가능한 높게 요청.
  const vc = { width: { ideal: hasBD ? 3840 : 1920 }, height: { ideal: hasBD ? 2160 : 1080 }, advanced: [{ focusMode: 'continuous' }] };
  if (deviceId) vc.deviceId = { exact: deviceId }; else vc.facingMode = 'environment';
  await scanner.start(deviceId || { facingMode: 'environment' }, { fps: 12, videoConstraints: vc }, onScan, () => {});
  await tuneCamera();
}
async function switchCam(id, save = true){
  if (save) lsSet(CAM_KEY, id);
  await startScan(id);
  const cur = camTrack && camTrack.getSettings().deviceId;
  if (cur) $('camSel').value = cur;
}
async function fillCameraList(){
  let cams = []; try { cams = await Html5Qrcode.getCameras(); } catch(e) {}
  const cur = camTrack && camTrack.getSettings().deviceId;
  $('camSel').innerHTML = cams.map((c, i) =>
    `<option value="${esc(c.id)}" ${c.id === cur ? 'selected' : ''}>${esc(c.label || ('카메라 ' + (i + 1)))}</option>`).join('');
  $('camBox').classList.toggle('d-none', cams.length < 2);
  // 저장된 선택이 없는데 초광각 카메라가 잡혔다면 일반 후면 카메라로 자동 전환
  if (!lsGet(CAM_KEY) && cams.length > 1) {
    const bad = /ultra|초광각/i, skip = /망원|tele|macro|매크로|front|전면/i, back = /back|rear|후면|environment/i;
    const curLabel = (cams.find(c => c.id === cur) || {}).label || '';
    if (bad.test(curLabel)) {
      const alt = cams.find(c => back.test(c.label) && !bad.test(c.label) && !skip.test(c.label));
      if (alt) await switchCam(alt.id, false);
    }
  }
}
$('camSel').onchange = e => switchCam(e.target.value, true).catch(() => toast('카메라를 전환할 수 없습니다.'));

$('scanModal').addEventListener('shown.bs.modal', async () => {
  try { await startScan(lsGet(CAM_KEY) || null); await fillCameraList(); }
  catch (err) {
    try { localStorage.removeItem(CAM_KEY); await startScan(null); await fillCameraList(); }   // 저장된 카메라가 없어졌으면 기본 카메라로
    catch (e2) { $('scanMsg').innerHTML = '<span class="text-danger">카메라를 시작할 수 없습니다. HTTPS 접속인지, 카메라 권한이 허용되어 있는지 확인하세요.</span>'; }
  }
});
$('scanModal').addEventListener('hidden.bs.modal', async () => {
  if (scanner) { try { await scanner.stop(); scanner.clear(); } catch(e) {} scanner = null; }
  camTrack = null; camState = {}; torchOn = false;
  ['zoomBox','btnTorch','camBox','foundPanel'].forEach(id => $(id).classList.add('d-none'));
  scanLocked = false; pending = null; lastCode = '';
});

/* ----- 카메라 초점/줌/조명 (제약 조건은 한 번에 합쳐서 적용) ----- */
async function applyCam(patch){
  Object.assign(camState, patch);
  if (!camTrack) return;
  try { await camTrack.applyConstraints({ advanced: [{ ...camState }] }); } catch(e) {}
}
async function tuneCamera(){
  const v = document.querySelector('#reader video');
  camTrack = v && v.srcObject && v.srcObject.getVideoTracks()[0];
  camState = {}; torchOn = false;
  $('zoomBox').classList.add('d-none'); $('btnTorch').classList.add('d-none'); $('btnTorch').classList.remove('active');
  if (!camTrack || !camTrack.getCapabilities) return;
  const cap = camTrack.getCapabilities();
  if (cap.focusMode && cap.focusMode.includes('continuous')) camState.focusMode = 'continuous';
  if (cap.zoom) {                                  // 작은 바코드: 기본 2배 줌으로 시작 (멀리서도 초점이 잡힘)
    const z = $('zoom'); z.min = cap.zoom.min; z.max = cap.zoom.max; z.step = cap.zoom.step || 0.1;
    camState.zoom = Math.min(Math.max(2, cap.zoom.min), cap.zoom.max);
    z.value = camState.zoom;
    $('zoomBox').classList.remove('d-none');
  }
  if (cap.torch) $('btnTorch').classList.remove('d-none');
  await applyCam({});
}
async function refocus(){
  if (!camTrack) return;
  const fm = (camTrack.getCapabilities ? camTrack.getCapabilities() : {}).focusMode || [];
  if (fm.includes('single-shot')) {
    await applyCam({ focusMode: 'single-shot' });
    setTimeout(() => applyCam({ focusMode: fm.includes('continuous') ? 'continuous' : 'single-shot' }), 800);
  } else if (fm.includes('continuous')) {
    if (fm.includes('manual')) await applyCam({ focusMode: 'manual' });
    await applyCam({ focusMode: 'continuous' });
  } else toast('이 기기는 초점 조절을 지원하지 않습니다. 줌과 거리를 조절해 보세요.');
}
$('btnFocus').onclick = refocus;
$('reader').addEventListener('click', refocus);
$('zoom').addEventListener('input', e => applyCam({ zoom: +e.target.value }));
$('btnTorch').onclick = () => { torchOn = !torchOn; $('btnTorch').classList.toggle('active', torchOn); applyCam({ torch: torchOn }); };

/* ----- 효과음 (WebAudio, 파일 불필요) ----- */
let actx = null;
function initAudio(){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e) {}
}
function tone(freq, start, dur, type = 'sine', vol = 0.25){
  if (!actx || !$('optSound').checked) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + start;
  o.type = type; o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
const soundOk   = () => { tone(1000, 0, 0.09); tone(1500, 0.10, 0.14); };                       // 찾음: 높은 "삐-빅"
const soundFail = () => { tone(220, 0, 0.22, 'sawtooth', 0.3); tone(150, 0.26, 0.34, 'sawtooth', 0.3); }; // 못 찾음: 낮은 "부-웅"
const vib = p => { if (navigator.vibrate) navigator.vibrate(p); };

/* ----- 스캔 결과 처리 ----- */
function onScan(code){
  if (scanLocked) return;                                       // 수량 입력 중에는 새 스캔 무시
  const now = Date.now();
  if (code === lastCode && now - lastTime < 1500) return;       // 같은 바코드 연속 인식 방지
  lastCode = code; lastTime = now;
  const m = MASTER.find(m => m.barcode === code);
  if (!m) {
    soundFail(); vib([200, 100, 200]);
    $('scanMsg').innerHTML = `<span class="text-danger fw-bold"><i class="bi bi-x-circle"></i> 미등록 바코드: ${esc(code)}</span>`;
    return;
  }
  soundOk(); vib(60);
  if ($('optPlus1').checked) {                                  // 입력 없이 +1 모드
    const i = addItem(m, true);
    $('scanMsg').innerHTML = `<span class="text-success fw-bold"><i class="bi bi-check-circle"></i> ${esc(m.name)} — 실재고 ${rows[i].actual}</span>`;
    return;
  }
  showFound(m);
}

function showFound(m){
  scanLocked = true; pending = m;
  const cur = rows.find(r => r.code === m.code);
  $('scanMsg').innerHTML = '';
  $('fpName').textContent = m.name;
  $('fpSub').textContent = [m.spec, m.unit].filter(Boolean).join(' · ');
  $('fpIds').textContent = `코드 ${m.code} · ${m.barcode}`;
  $('fpStock').textContent = (cur ? cur.stock : m.stock) + (m.unit || '');
  $('fpQty').value = cur && cur.actual !== '' && cur.actual != null ? cur.actual : '';
  $('fpQty').classList.remove('is-invalid');
  $('foundPanel').classList.remove('d-none');
  $('foundPanel').scrollIntoView({ block: 'nearest' });
  setTimeout(() => { $('fpQty').focus(); $('fpQty').select(); }, 60);
}
function closeFound(){
  $('foundPanel').classList.add('d-none');
  pending = null; scanLocked = false; lastCode = '';
  $('scanMsg').textContent = '다음 바코드를 비춰주세요.';
}
function confirmQty(){
  if (!pending) return;
  const v = $('fpQty').value.trim();
  if (v === '' || isNaN(Number(v))) { $('fpQty').classList.add('is-invalid'); $('fpQty').focus(); return; }
  const i = addItem(pending, false);
  rows[i].actual = v; render(i);
  toast(`${pending.name} 실재고 ${v}`);
  closeFound();
}
const stepQty = d => { const n = Number($('fpQty').value) || 0; $('fpQty').value = Math.max(0, n + d); };
$('fpOk').onclick = confirmQty;
$('fpCancel').onclick = closeFound;
$('fpPlus').onclick = () => stepQty(1);
$('fpMinus').onclick = () => stepQty(-1);
$('fpQty').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); confirmQty(); } });

/* ===== 저장 / CSV / 비우기 ===== */
$('btnSave').onclick = async () => {
  /* TODO: 서버 API(→ UniDAC/Firebird)로 전송 */
  // const res = await fetch('/api/stocktake', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(rows)});
  persist(); toast('이 기기에 저장했습니다. (서버 연동은 saveToServer 부분에 구현)');
};
/* ----- CSV 공통 ----- */
const HEAD = ['코드','바코드','상품명','규격','단위','전산재고','실재고'];
const csvLine = a => a.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',');
function downloadCsv(name, lines){
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});   // BOM: 엑셀 한글 깨짐 방지
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const today = () => new Date().toISOString().slice(0,10);

/* 다운로드: 현재 조사 목록 (차이 포함) */
$('btnSample').onclick = e => { e.preventDefault(); rows = sampleRows(); render(); toast('샘플 8건을 불러왔습니다.'); };
$('btnCsv').onclick = () => {
  if (!rows.length) return toast('다운로드할 조사 목록이 없습니다.');
  downloadCsv(`재고조사_${today()}.csv`, [csvLine([...HEAD,'차이']),
    ...rows.map(r => csvLine([r.code,r.barcode,r.name,r.spec,r.unit,r.stock,r.actual,(Number(r.actual)||0)-(Number(r.stock)||0)]))]);
};
$('btnMasterCsv').onclick = e => { e.preventDefault();
  downloadCsv(`상품마스터_${today()}.csv`, [csvLine(HEAD.slice(0,6)), ...MASTER.map(m => csvLine([m.code,m.barcode,m.name,m.spec,m.unit,m.stock]))]); };
$('btnTemplate').onclick = e => { e.preventDefault();
  downloadCsv('업로드양식.csv', [csvLine(HEAD), ...SAMPLE.slice(0,5).map(m => csvLine([m.code,m.barcode,m.name,m.spec,m.unit,m.stock,'']))]); };

/* 업로드: 상품 마스터에 병합(코드 기준). '실재고' 값이 있는 행은 조사 목록에도 반영 */
function parseCsv(text){
  const out = []; let row = [], cur = '', q = false;
  text = text.replace(/^\ufeff/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); out.push(row); }
  return out.filter(r => r.some(v => v.trim() !== ''));
}
const ALIAS = { code:['코드','상품코드','code'], barcode:['바코드','barcode'], name:['상품명','품명','name'],
                spec:['규격','spec'], unit:['단위','unit'], stock:['전산재고','재고','stock'], actual:['실재고','실사','actual'] };

$('btnUpload').onclick = () => $('fileCsv').click();
$('fileCsv').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const buf = await f.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('\ufffd')) text = new TextDecoder('euc-kr').decode(buf);   // 엑셀 기본 CSV(CP949) 대응
  const data = parseCsv(text);
  if (data.length < 2) return toast('데이터가 없습니다.');
  const h = data[0].map(s => s.trim().toLowerCase());
  const col = {}; for (const k in ALIAS) col[k] = h.findIndex(x => ALIAS[k].includes(x));
  if (col.code < 0 && col.barcode < 0) return toast('헤더에 "코드" 또는 "바코드" 열이 필요합니다.');
  let added = 0, upd = 0, counted = 0;
  for (const r of data.slice(1)) {
    const g = k => col[k] >= 0 ? (r[col[k]] ?? '').trim() : '';
    const item = { code: g('code'), barcode: g('barcode'), name: g('name'), spec: g('spec'), unit: g('unit'), stock: g('stock') };
    if (!item.code) item.code = item.barcode;
    if (!item.code) continue;
    const mi = MASTER.findIndex(m => m.code === item.code);
    if (mi < 0) { MASTER.push(item); added++; } else { MASTER[mi] = {...MASTER[mi], ...Object.fromEntries(Object.entries(item).filter(([,v]) => v !== ''))}; upd++; }
    const actual = g('actual');
    if (actual !== '') {
      const ri = rows.findIndex(x => x.code === item.code);
      const merged = {...(mi < 0 ? item : MASTER[mi]), actual};
      if (ri < 0) rows.push(merged); else rows[ri] = merged;
      counted++;
    }
  }
  try { localStorage.setItem('stocktake_master_v1', JSON.stringify(MASTER)); } catch(err) {}
  render();
  toast(`업로드 완료 — 신규 ${added}, 갱신 ${upd}${counted ? `, 실재고 반영 ${counted}` : ''}`);
};
$('btnClear').onclick = () => { if (confirm('조사 목록을 모두 비울까요?')) { rows = []; render(); } };

render();
</script>
